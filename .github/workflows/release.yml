name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install stable Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET"
      - name: Package archive and checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="carnet-v${VERSION}-${TARGET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "$ARCHIVE" carnet
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Upload packaged target
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            carnet-v*-${{ matrix.target }}.tar.gz
            carnet-v*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download packaged targets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
