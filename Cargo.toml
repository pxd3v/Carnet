[package]
name = "carnet"
version = "0.1.0"
edition = "2024"
description = "A terminal note editor with Git-backed repositories"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.16"
thiserror = "2.0"
toml = "0.8"
uuid = { version = "1.16", features = ["serde", "v4"] }
