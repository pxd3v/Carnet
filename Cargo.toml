[package]
name = "carnet"
version = "0.1.0"
edition = "2024"
description = "A terminal note editor with Git-backed repositories"

[dependencies]
arboard = { version = "3.6", default-features = false }
cap-std = "4.0.2"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
libc = "0.2"
ratatui = "0.30.2"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
tempfile = "3.16"
thiserror = "2.0"
toml = "0.8"
unicode-segmentation = "1.12"
unicode-width = "0.2"
uuid = { version = "1.16", features = ["serde", "v4"] }

[dev-dependencies]
insta = "1.48"
proptest = "1.7"
